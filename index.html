<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ares 100 — Mars Colony Command</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Start Screen -->
    <section id="start-screen" class="screen active">
      <div class="mars-orb" aria-hidden="true"></div>
      <p class="eyebrow">ARES COLONY // SOL 001</p>
      <h1 id="intro-title"></h1>
      <p id="intro-text" class="intro-text"></p>
      <ul class="rules-list">
        <li>Swipe left or right (or use Arrow keys) to decide.</li>
        <li>Keep Oxygen, Food, Energy, and Morale between 0 and 100.</li>
        <li>Survive 100 Martian weeks until the next supply window.</li>
      </ul>
      <button id="start-btn" class="btn-primary" type="button">Assume Command</button>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen" aria-live="polite">
      <header class="hud">
        <div class="meters" id="meters">
          <div class="meter" data-meter="oxygen">
            <span class="meter-dot" aria-hidden="true"></span>
            <span class="meter-name">Oxygen</span>
            <div class="meter-track"><div class="meter-fill"></div></div>
          </div>
          <div class="meter" data-meter="food">
            <span class="meter-dot" aria-hidden="true"></span>
            <span class="meter-name">Food</span>
            <div class="meter-track"><div class="meter-fill"></div></div>
          </div>
          <div class="meter" data-meter="energy">
            <span class="meter-dot" aria-hidden="true"></span>
            <span class="meter-name">Energy</span>
            <div class="meter-track"><div class="meter-fill"></div></div>
          </div>
          <div class="meter" data-meter="morale">
            <span class="meter-dot" aria-hidden="true"></span>
            <span class="meter-name">Morale</span>
            <div class="meter-track"><div class="meter-fill"></div></div>
          </div>
        </div>
        <div id="week-counter" class="week-counter">Week 1 of 100</div>
      </header>

      <div class="arena">
        <div id="card" class="card" tabindex="0">
          <div id="card-badge" class="card-badge"></div>
          <div class="card-emblem" aria-hidden="true"></div>
          <div id="card-who" class="card-who"></div>
          <p id="card-text" class="card-text"></p>
          <div class="card-hint" aria-hidden="true">&larr; Swipe &rarr;</div>
        </div>

        <div id="result-box" class="result-box hidden">
          <p id="result-text"></p>
        </div>
      </div>

      <footer class="choices-bar">
        <span id="choice-left" class="choice-label choice-left"></span>
        <span id="choice-right" class="choice-label choice-right"></span>
      </footer>
    </section>

    <!-- End Screen -->
    <section id="end-screen" class="screen">
      <p id="end-tag" class="eyebrow">MISSION REPORT</p>
      <h1 id="end-title"></h1>
      <p id="end-text" class="intro-text"></p>
      <div id="end-weeks" class="weeks-survived"></div>
      <button id="restart-btn" class="btn-primary" type="button">Play Again</button>
    </section>
  </main>

  <!-- Scripts loaded in exact contract order -->
  <script src="cards_a.js"></script>
  <script src="cards_b.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
